[package]
name = "gh-review-ui"
version = "0.1.0"
edition = "2021"
description = "Minimal, lazygit-style terminal UI for reviewing GitHub PRs."
license = "MIT"

[[bin]]
name = "gh-review-ui"
path = "src/main.rs"

[lib]
name = "ghreview"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
lto = true
strip = true
